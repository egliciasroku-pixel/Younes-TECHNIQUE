<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURELIA | لوحة فحص الروابط الفاخرة مع الخادم الوسيط</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-obsidian: #07080c;
      --bg-panel: #0e1017;
      --bg-card: #141721;
      --bg-input: #1b1f2c;
      --gold-primary: #d4af37;
      --gold-light: #f8eab8;
      --gold-dark: #9c7816;
      --gold-glow: rgba(212, 175, 55, 0.22);
      --text-main: #f5f5f7;
      --text-muted: #8c92a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top center, #181c2b 0%, var(--bg-obsidian) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 600px;
    }

    .panel {
      background: linear-gradient(165deg, #12151f 0%, var(--bg-panel) 100%);
      border-radius: 22px;
      padding: 28px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(212, 175, 55, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .crown {
      color: var(--gold-primary);
      font-size: 26px;
      text-shadow: 0 0 18px var(--gold-glow);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .badge {
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(212, 175, 55, 0.12);
      color: var(--gold-primary);
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      background: var(--bg-input);
      border-radius: 12px;
      padding: 13px 15px;
      color: var(--text-main);
      font-size: 13px;
      font-family: 'Consolas', monospace;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
    }

    .input-wrapper input {
      padding-left: 38px;
    }

    input:focus {
      background: #202534;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.45),
        0 0 18px var(--gold-glow);
    }

    .icon-btn {
      position: absolute;
      left: 10px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
    }

    .toggles {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 4px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .switch-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg-input);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
      transition: 0.3s;
      border-radius: 30px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(212, 175, 55, 0.22);
    }

    input:checked + .slider::before {
      transform: translateX(20px);
      background-color: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-primary);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 55%, var(--gold-dark) 100%);
      color: #090a0f;
      border-radius: 12px;
      padding: 13px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.25);
      transition: transform 0.2s ease, box-shadow 0.25s ease;
    }

    .btn-primary:hover {
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--gold-light);
      border-radius: 12px;
      padding: 0 16px;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.16);
      color: var(--gold-primary);
    }

    .output-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0 4px;
    }

    .meta {
      color: var(--gold-primary);
      font-family: 'Consolas', monospace;
    }

    .output-box {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      height: 270px;
      overflow-y: auto;
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #e4e8f2;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.55);
    }

    .output-box::-webkit-scrollbar {
      width: 5px;
    }

    .output-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .output-box::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <main class="panel">
      <header class="header">
        <div class="brand">
          <span class="crown">✦</span>
          <div>
            <h1>AURELIA</h1>
            <p class="subtitle">بوابة فحص الروابط مع خادم الوسيط المحلي</p>
          </div>
        </div>
        <span class="badge" id="statusBadge">جاهز</span>
      </header>

      <section class="card">
        <div class="field">
          <label for="targetUrl">الرابط المستهدف (Endpoint URL)</label>
          <div class="input-wrapper">
            <input
              type="url"
              id="targetUrl"
              placeholder="https://lamyarstv.pro/users.php"
              autocomplete="off"
              dir="ltr"
            />
            <button id="clearUrlBtn" class="icon-btn" title="مسح الرابط">✕</button>
          </div>
        </div>

        <div class="field">
          <label for="proxyServerUrl">عنوان الخادم الوسيط (Proxy Server URL)</label>
          <input
            type="text"
            id="proxyServerUrl"
            value="http://localhost:3000/fetch?url="
            autocomplete="off"
            dir="ltr"
          />
        </div>

        <div class="toggles">
          <div class="toggle-row">
            <span class="switch-label">استخراج النص الصافي فقط (إزالة أكواد HTML)</span>
            <label class="switch">
              <input type="checkbox" id="stripHtml" checked />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle-row">
            <span class="switch-label">تنسيق بيانات JSON تلقائياً</span>
            <label class="switch">
              <input type="checkbox" id="formatJson" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="fetchBtn" class="btn-primary">فحص وجلب المحتوى عبر الخادم</button>
          <button id="copyBtn" class="btn-secondary">نسخ</button>
          <button id="downloadBtn" class="btn-secondary">حفظ</button>
        </div>
      </section>

      <section class="output-section">
        <div class="output-header">
          <span>البيانات المسترجعة</span>
          <span id="metaInfo" class="meta">0.00 KB • 0 ms</span>
        </div>
        <pre id="output" class="output-box" dir="ltr">في انتظار إدخال الرابط وفحصه...</pre>
      </section>
    </main>
  </div>

  <script>
    const targetUrlInput = document.getElementById('targetUrl');
    const proxyServerUrlInput = document.getElementById('proxyServerUrl');
    const stripHtmlCheckbox = document.getElementById('stripHtml');
    const formatJsonCheckbox = document.getElementById('formatJson');
    const outputBox = document.getElementById('output');
    const statusBadge = document.getElementById('statusBadge');
    const metaInfo = document.getElementById('metaInfo');

    let lastRawResponse = '';

    document.getElementById('clearUrlBtn').addEventListener('click', () => {
      targetUrlInput.value = '';
      targetUrlInput.focus();
    });

    stripHtmlCheckbox.addEventListener('change', () => renderOutput(lastRawResponse));
    formatJsonCheckbox.addEventListener('change', () => renderOutput(lastRawResponse));

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const rawUrl = targetUrlInput.value.trim();
      const proxyBase = proxyServerUrlInput.value.trim();

      if (!rawUrl) {
        setStatus('الرابط مفقود', '#e05252', 'rgba(224, 82, 82, 0.14)');
        outputBox.textContent = '⚠ يرجى إدخال الرابط المستهدف أولاً.';
        return;
      }

      const finalUrl = proxyBase + encodeURIComponent(rawUrl);

      setStatus('جاري الجلب...', '#f8eab8', 'rgba(212, 175, 55, 0.18)');
      outputBox.textContent = 'جاري إرسال الطلب عبر الخادم الوسيط...';
      const startTime = performance.now();

      try {
        const response = await fetch(finalUrl);
        const elapsed = Math.round(performance.now() - startTime);
        const text = await response.text();
        lastRawResponse = text;

        const sizeKb = (new Blob([text]).size / 1024).toFixed(2);
        metaInfo.textContent = `${sizeKb} KB • ${elapsed} ms`;

        if (response.ok) {
          setStatus(`HTTP ${response.status}`, '#4cd964', 'rgba(76, 217, 100, 0.14)');
        } else {
          setStatus(`HTTP ${response.status}`, '#e05252', 'rgba(224, 82, 82, 0.14)');
        }

        renderOutput(text);
      } catch (err) {
        const elapsed = Math.round(performance.now() - startTime);
        metaInfo.textContent = `0.00 KB • ${elapsed} ms`;
        setStatus('خطأ في الاتصال', '#e05252', 'rgba(224, 82, 82, 0.14)');
        outputBox.textContent =
          `تعذر الاتصال بالخادم الوسيط المحلي:\n${err.message}\n\n` +
          `تأكد من تشغيل خادم الـ Node.js المحلي على المنفذ 3000 (راجع كود الخادم أدناه).`;
      }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      if (!outputBox.textContent) return;
      navigator.clipboard.writeText(outputBox.textContent).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'تم النسخ ✓';
        setTimeout(() => (btn.textContent = 'نسخ'), 1500);
      });
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const content = outputBox.textContent;
      if (!content) return;

      const isJson = content.trim().startsWith('{') || content.trim().startsWith('[');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = isJson ? 'aurelia-data.json' : 'aurelia-data.txt';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    function renderOutput(rawText) {
      if (!rawText) return;

      if (formatJsonCheckbox.checked) {
        try {
          const parsed = JSON.parse(rawText);
          outputBox.textContent = JSON.stringify(parsed, null, 2);
          return;
        } catch (_) {}
      }

      if (stripHtmlCheckbox.checked) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawText, 'text/html');
        doc.querySelectorAll('script, style, noscript, iframe').forEach((el) => el.remove());
        const clean = (doc.body?.innerText || rawText).replace(/\n{3,}/g, '\n\n').trim();
        outputBox.textContent = clean;
      } else {
        outputBox.textContent = rawText;
      }
    }

    function setStatus(label, color, bgColor) {
      statusBadge.textContent = label;
      statusBadge.style.color = color;
      statusBadge.style.background = bgColor;
    }
  </script>
</body>
</html>
