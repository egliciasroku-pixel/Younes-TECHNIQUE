<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUXURY PLAYER - Royal Cached</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #080808;
            --bg-card: rgba(18, 18, 18, 0.75);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --accent-glow: rgba(212, 175, 55, 0.35);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border-glass: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(170, 130, 10, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .setup-card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(10, 10, 10, 0.95));
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 40px var(--accent-glow);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }

        .setup-card h2 {
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .setup-card p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: var(--gold-light);
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .royal-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
        }

        #app-container {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            color: var(--gold-primary);
            font-size: 22px;
            filter: drop-shadow(0 0 8px var(--gold-primary));
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(to right, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--gold-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .main-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px 20px;
            background: rgba(15, 15, 15, 0.6);
        }

        .tab-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid var(--border-glass);
            padding: 10px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(170, 130, 10, 0.1));
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .content-area {
            padding: 0 20px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
        }

        .section-title {
            font-size: 14px;
            color: var(--gold-light);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: rgba(25, 25, 25, 0.7);
            border: 1px solid var(--border-glass);
            padding: 7px 14px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-chip.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 700;
            border-color: var(--gold-primary);
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .channel-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-2px);
        }

        .channel-poster {
            width: 100%;
            height: 100px;
            background: #151515;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .channel-poster i {
            font-size: 26px;
            color: var(--gold-primary);
        }

        .channel-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-info {
            padding: 8px;
            text-align: center;
        }

        .channel-info h4 {
            font-size: 12px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 10, 10, 0.9);
        }

        .player-header h3 {
            color: var(--gold-light);
            font-size: 15px;
        }

        .close-player {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            outline: none;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader p {
            color: var(--gold-light);
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-card">
            <h2>LUXURY PLAYER</h2>
            <p>أدخل بيانات الحساب للتشغيل المحلي الثابت</p>
            
            <div class="input-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="in-user" placeholder="Username">
            </div>
            <div class="input-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="in-pass" placeholder="Password">
            </div>

            <button class="royal-btn" onclick="saveAndConnect()">دخول ملكي</button>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p>جاري التخزين المحلي المؤقت...</p>
    </div>

    <div id="app-container">
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-crown"></i>
                <h1>LUXURY PLAYER</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="forceRefreshCache()" title="تحديث وتفريغ الذاكرة"><i class="fa-solid fa-rotate"></i></button>
                <button class="icon-btn" onclick="resetSettings()" title="إعدادات الحساب"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <div class="main-tabs">
            <button class="tab-btn active" onclick="switchTab('live')" id="tab-live">
                <i class="fa-solid fa-tv"></i> LIVE
            </button>
            <button class="tab-btn" onclick="switchTab('movie')" id="tab-movie">
                <i class="fa-solid fa-film"></i> FILMS
            </button>
            <button class="tab-btn" onclick="switchTab('series')" id="tab-series">
                <i class="fa-solid fa-video"></i> SERIES
            </button>
        </div>

        <div class="content-area">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="بحث سريع في المحتوى الحالي..." oninput="filterChannels()">
            </div>

            <div class="section-title"><i class="fa-solid fa-list"></i> التصنيفات</div>
            <div class="categories-container" id="categories-list"></div>

            <div class="section-title"><i class="fa-solid fa-play"></i> المحتوى</div>
            <div class="grid-channels" id="channels-grid"></div>
        </div>
    </div>

    <div id="player-modal">
        <div class="player-header">
            <h3 id="player-title">تشغيل</h3>
            <button class="close-player" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="video-container">
            <video id="native-video" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        const SERVER_HOST = "http://smart-v2.live:80";
        let SERVER_USER = "";
        let SERVER_PASS = "";
        let currentType = 'live'; 
        let activeCategory = 'all';

        // ذاكرة تخزين مؤقت داخلية تشبه نظام الـ PHP Header Caching محلياً
        let memoryCache = {
            live: { cats: [], items: [] },
            movie: { cats: [], items: [] },
            series: { cats: [], items: [] }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('lux_user');
            const savedPass = localStorage.getItem('lux_pass');

            if (savedUser && savedPass) {
                SERVER_USER = savedUser;
                SERVER_PASS = savedPass;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                initAppCache();
            }
        });

        function saveAndConnect() {
            let user = document.getElementById('in-user').value.trim();
            let pass = document.getElementById('in-pass').value.trim();

            if (!user || !pass) {
                alert('المرجو إدخال اسم المستخدم وكلمة المرور.');
                return;
            }

            localStorage.setItem('lux_user', user);
            localStorage.setItem('lux_pass', pass);
            location.reload();
        }

        function resetSettings() {
            if(confirm('هل تريد مسح الحساب وإعادة الإعدادات؟')) {
                localStorage.clear();
                location.reload();
            }
        }

        function forceRefreshCache() {
            memoryCache = {
                live: { cats: [], items: [] },
                movie: { cats: [], items: [] },
                series: { cats: [], items: [] }
            };
            initAppCache();
        }

        // جلب وتخزين البيانات في الذاكرة المؤقتة مرة واحدة لكل قسم لمنع الرجوع للبحث أو إعادة الطلب
        async function initAppCache() {
            showLoader(true);
            try {
                // جلب بيانات الأقسام الثلاثة دفعة واحدة وتخزينها محلياً في الذاكرة
                await fetchSectionData('live', 'get_live_categories', 'get_live_streams');
                await fetchSectionData('movie', 'get_vod_categories', 'get_vod_streams');
                await fetchSectionData('series', 'get_series_categories', 'get_series');

                renderCategories();
                renderChannels();
            } catch (error) {
                console.error("Cache init error:", error);
            } finally {
                showLoader(false);
            }
        }

        async function fetchSectionData(type, catAction, listAction) {
            if (memoryCache[type].items.length > 0) return; // إذا كانت مخزنة مسبقاً، لا تعيد الطلب

            let catUrl = `${SERVER_HOST}/player_api.php?username=${SERVER_USER}&password=${SERVER_PASS}&action=${catAction}`;
            let listUrl = `${SERVER_HOST}/player_api.php?username=${SERVER_USER}&password=${SERVER_PASS}&action=${listAction}`;

            try {
                let [catRes, listRes] = await Promise.all([
                    fetch(catUrl).catch(() => null),
                    fetch(listUrl).catch(() => null)
                ]);

                if (catRes && catRes.ok) {
                    let text = await catRes.text();
                    try { memoryCache[type].cats = JSON.parse(text); } catch(e) { memoryCache[type].cats = []; }
                }

                if (listRes && listRes.ok) {
                    let text = await listRes.text();
                    try { memoryCache[type].items = JSON.parse(text); } catch(e) { memoryCache[type].items = []; }
                }
            } catch (err) {
                console.error(`Error fetching ${type}:`, err);
            }
        }

        function switchTab(type) {
            currentType = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
            activeCategory = 'all';
            document.getElementById('search-input').value = '';
            
            // العرض فوري من الذاكرة المحلية المخزنة دون انتظار السيرفر
            renderCategories();
            renderChannels();
        }

        function renderCategories() {
            const container = document.getElementById('categories-list');
            let cats = memoryCache[currentType].cats;
            let html = `<div class="cat-chip active" onclick="filterByCategory('all', this)">الكل</div>`;

            if (Array.isArray(cats)) {
                cats.forEach(cat => {
                    let catId = cat.category_id || '';
                    let catName = cat.category_name || 'قسم';
                    html += `<div class="cat-chip" onclick="filterByCategory('${catId}', this)">${catName}</div>`;
                });
            }
            container.innerHTML = html;
        }

        function filterByCategory(catId, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            activeCategory = catId;
            renderChannels();
        }

        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            let items = memoryCache[currentType].items;
            let filtered = items;

            if (activeCategory !== 'all' && Array.isArray(items)) {
                filtered = items.filter(item => {
                    return (item.category_id == activeCategory) || (item.category_ids && item.category_ids.includes(activeCategory));
                });
            }

            let html = '';
            if (!Array.isArray(filtered) || filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:20px;">لا توجد محتويات متاحة في هذا القسم</p>';
                return;
            }

            filtered.slice(0, 100).forEach(item => {
                let name = item.name || item.title || 'بدون اسم';
                let img = item.stream_icon || item.cover || '';
                let id = item.stream_id || item.series_id || item.id || '';
                let posterHtml = img ? `<img src="${img}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\'fa-solid fa-film\'></i>';">` : `<i class="fa-solid fa-film"></i>`;

                html += `
                    <div class="channel-card" onclick="playItem('${id}', '${name.replace(/'/g, "")}')">
                        <div class="channel-poster">${posterHtml}</div>
                        <div class="channel-info">
                            <h4>${name}</h4>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterChannels() {
            let query = document.getElementById('search-input').value.toLowerCase();
            let items = memoryCache[currentType].items;
            if (!Array.isArray(items)) return;

            let filtered = items.filter(item => {
                let name = (item.name || item.title || '').toLowerCase();
                return name.includes(query);
            });

            const grid = document.getElementById('channels-grid');
            let html = '';
            filtered.slice(0, 100).forEach(item => {
                let name = item.name || item.title || '';
                let img = item.stream_icon || item.cover || '';
                let id = item.stream_id || item.series_id || item.id || '';
                let posterHtml = img ? `<img src="${img}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\'fa-solid fa-film\'></i>';">` : `<i class="fa-solid fa-film"></i>`;

                html += `
                    <div class="channel-card" onclick="playItem('${id}', '${name.replace(/'/g, "")}')">
                        <div class="channel-poster">${posterHtml}</div>
                        <div class="channel-info">
                            <h4>${name}</h4>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function playItem(id, name) {
            let streamUrl = '';
            if (currentType === 'live') {
                streamUrl = `${SERVER_HOST}/live/${SERVER_USER}/${SERVER_PASS}/${id}.m3u8`;
            } else if (currentType === 'movie') {
                let ext = 'mp4';
                let matched = memoryCache.movie.items.find(m => m.stream_id == id || m.id == id);
                if (matched && matched.container_extension) ext = matched.container_extension;
                streamUrl = `${SERVER_HOST}/movie/${SERVER_USER}/${SERVER_PASS}/${id}.${ext}`;
            } else if (currentType === 'series') {
                streamUrl = `${SERVER_HOST}/series/${SERVER_USER}/${SERVER_PASS}/${id}.mp4`;
            }

            document.getElementById('player-title').innerText = name;
            let videoElem = document.getElementById('native-video');
            videoElem.src = streamUrl;
            document.getElementById('player-modal').style.display = 'flex';
            videoElem.play().catch(e => console.log("Play error:", e));
        }

        function closePlayer() {
            let videoElem = document.getElementById('native-video');
            videoElem.pause();
            videoElem.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
