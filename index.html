<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YOUNES TECHNIQUE — Token Generator Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; } 
:root{ 
  --bg:#020405; 
  --panel:linear-gradient(145deg,#070d10,#030607); 
  --lime:#a8ff00; 
  --lime2:#c4ff52; 
  --text:#f0f5f3; 
  --muted:#859693; 
  --green:#37e39a; 
  --red:#ff4d4d;
  --gold:#ffd700;
  --shadow:0 20px 50px rgba(0,0,0,0.9), 0 0 25px rgba(168,255,0,0.1); 
} 
body{ 
  background: radial-gradient(circle at 50% 0%, rgba(168,255,0,.08), transparent 50%), var(--bg); 
  color:var(--text); 
  min-height:100vh; 
  display:flex; 
  flex-direction:column;
  align-items:center; 
  justify-content:flex-start; 
  padding:20px 15px; 
  font-size:12px; 
  gap: 20px;
}

.token-generator-card, .logs-card {
  width: 100%;
  max-width: 480px;
  background: var(--panel);
  border-radius: 24px;
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(168, 255, 0, 0.15);
}

.card-header { text-align: center; margin-bottom: 20px; }
.card-header i { font-size: 42px; color: var(--lime); margin-bottom: 8px; text-shadow: 0 0 15px rgba(168,255,0,0.4); }
.card-header h2 { font-size: 16px; font-weight: 900; color: #fff; }
.card-header h2 span { color: var(--lime); }
.card-header p { color: var(--muted); font-size: 10px; margin-top: 4px; }

.form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 10px; color: var(--muted); font-weight: 700; }
.input {
  width: 100%; background: #030607 !important; border: 1px solid rgba(255, 255, 255, 0.08) !important;
  color: #fff !important; outline: none !important; border-radius: 14px !important; padding: 11px 14px !important;
  font-size: 11px !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); transition: 0.3s;
}
.input:focus { border-color: var(--lime) !important; box-shadow: 0 0 10px rgba(168,255,0,0.2); }

.btn {
  width: 100%; border: none; background: rgba(168, 255, 0, 0.15); color: var(--lime2);
  border-radius: 14px; padding: 12px; font-weight: 900; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; margin-top: 6px;
}
.btn:hover { background: rgba(168, 255, 0, 0.25); transform: translateY(-1px); }

.result-box {
  margin-top: 18px; background: rgba(3, 6, 7, 0.9); border-radius: 16px; padding: 14px;
  border: 1px dashed rgba(168, 255, 0, 0.3); display: none; flex-direction: column; gap: 10px;
}
.token-display {
  background: #000; padding: 10px; border-radius: 10px; font-family: monospace;
  color: var(--lime); font-size: 13px; font-weight: bold; text-align: center; letter-spacing: 1px;
  border: 1px solid rgba(168,255,0,0.2);
}

.action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-whatsapp { background: rgba(55, 227, 154, 0.15) !important; color: var(--green) !important; }
.btn-copy { background: rgba(255, 255, 255, 0.05) !important; color: #fff !important; }

.logs-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;
}
.logs-title { font-weight: 800; font-size: 13px; color: var(--lime); display: flex; align-items: center; gap: 8px; }
.logs-count { background: rgba(168,255,0,0.15); color: var(--lime); padding: 2px 8px; border-radius: 20px; font-size: 10px; }

.search-box { margin-bottom: 12px; }

.client-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding-left: 2px; }
.client-list::-webkit-scrollbar { width: 4px; }
.client-list::-webkit-scrollbar-thumb { background: rgba(168,255,0,0.2); border-radius: 4px; }

.client-card {
  background: rgba(3, 6, 7, 0.7); border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  transition: 0.3s; position: relative;
}
.client-card:hover { border-color: rgba(168, 255, 0, 0.3); background: rgba(7, 13, 16, 0.9); }

.client-top { display: flex; justify-content: space-between; align-items: center; }
.client-name { font-weight: 800; color: #fff; font-size: 12px; }
.client-phone { color: var(--muted); font-size: 10px; }

.client-token-row {
  display: flex; justify-content: space-between; align-items: center; background: #000;
  padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(168,255,0,0.1);
}
.client-token { font-family: monospace; color: var(--lime); font-size: 11px; font-weight: 700; }

.client-footer { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: var(--muted); }
.badge-expiry { background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 6px; }

.card-actions { display: flex; gap: 6px; }
.btn-icon {
  background: rgba(255,255,255,0.05); border: none; color: var(--muted);
  width: 26px; height: 26px; border-radius: 8px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: 0.2s; font-size: 11px;
}
.btn-icon:hover { color: #fff; background: rgba(255,255,255,0.15); }
.btn-icon.delete:hover { color: #fff; background: var(--red); }

.empty-state { text-align: center; color: var(--muted); padding: 20px 0; font-size: 11px; }

.toast {
  position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%) translateY(50px);
  background: #0a1215; color: white; padding: 10px 18px; border-radius: 12px; font-size: 11px;
  z-index: 1000; opacity: 0; transition: 0.3s; border: 1px solid rgba(168,255,0,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="token-generator-card">
  <div class="card-header">
    <i class="fa-solid fa-key"></i>
    <h2>YOUNES <span>TECHNIQUE</span></h2>
    <p>لوحة توليد وتصدير كود الـ Token للعميل مع السجلات المحلية الدائمة</p>
  </div>

  <div class="form-group">
    <label>اسم العميل</label>
    <input class="input" id="genName" placeholder="مثال: يونس الفروقي">
  </div>

  <div class="form-group">
    <label>رقم هاتف العميل (مع الرمز الدولي)</label>
    <input class="input" id="genPhone" placeholder="+212600000000">
  </div>

  <div class="form-group">
    <label>رابط صورة الشعار / البراند (Brand Logo URL)</label>
    <input class="input" id="genLogoUrl" placeholder="https://example.com/logo.png (لتظهر تلقائياً في الفاتورة)">
  </div>

  <div class="form-group">
    <label>تاريخ انتهاء الصلاحية</label>
    <div style="display:flex; gap:6px;">
      <input class="input" type="date" id="genExpiry" style="flex:1;">
      <button type="button" class="btn" style="width:auto; padding:0 12px; background:rgba(255,255,255,0.05); color:var(--lime);" onclick="setLifetimeExpiry()">∞ Lifetime</button>
    </div>
  </div>

  <button class="btn" onclick="generateAndShowToken()">
    <i class="fa-solid fa-wand-magic-sparkles"></i> توليد وحفظ كود التوكن
  </button>

  <div class="result-box" id="resultBox">
    <div style="font-size:10px; color:var(--muted); font-weight:700;">كود التوكن المولّد بنجاح:</div>
    <div class="token-display" id="tokenOutput">YT-XXXX-XXXX</div>
    <div class="action-buttons">
      <button class="btn btn-copy" onclick="copyToken()"><i class="fa-solid fa-copy"></i> نسخ الكود</button>
      <button class="btn btn-whatsapp" onclick="sendViaWhatsApp()"><i class="fa-brands fa-whatsapp"></i> إرسال واتساب</button>
    </div>
  </div>
</div>

<div class="logs-card">
  <div class="logs-header">
    <div class="logs-title">
      <i class="fa-solid fa-users-gear"></i> سجلات العملاء المحفوظة
      <span class="logs-count" id="clientsCount">0</span>
    </div>
  </div>

  <div class="search-box">
    <input class="input" id="searchClient" placeholder="🔍 بحث باسم العميل، الرقم أو التوكن..." oninput="renderClients()">
  </div>

  <div class="client-list" id="clientList">
    <div class="empty-state">لا يوجد عملاء مسجلون حالياً</div>
  </div>
</div>

<div class="toast" id="toast">تم النسخ بنجاح</div>

<script>
let clientsData = JSON.parse(localStorage.getItem("yt_valid_tokens") || "{}");
document.getElementById('genExpiry').value = new Date().toISOString().split('T')[0];
renderClients();

function setLifetimeExpiry() {
  document.getElementById("genExpiry").value = "2099-12-31";
  showToast("✓ تم ضبط الصلاحية على Lifetime (دائم)");
}

function generateUnifiedToken(phone, expiryDate) {
  const cleanPhone = String(phone || "").trim().replace(/\D/g, '');
  const cleanDate = String(expiryDate || "").trim();
  if (!cleanPhone || !cleanDate) return null;

  const rawStr = `YT-${cleanPhone}-${cleanDate}`;
  let hash = 0;
  for (let i = 0; i < rawStr.length; i++) {
    hash = ((hash << 5) - hash) + rawStr.charCodeAt(i);
    hash |= 0;
  }
  
  const codeSegment = Math.abs(hash).toString(36).toUpperCase().padStart(6, '0').slice(0, 6);
  const phoneSegment = cleanPhone.slice(-4) || "0000";
  return `YT-${codeSegment}-${phoneSegment}`;
}

let generatedTokenText = "";

function generateAndShowToken() {
  const name = document.getElementById('genName').value.trim();
  const phone = document.getElementById('genPhone').value.trim();
  const logoUrl = document.getElementById('genLogoUrl').value.trim();
  const expiry = document.getElementById('genExpiry').value;

  if(!name || !phone || !expiry) {
    showToast("المرجو ملء جميع الحقول أولاً");
    return;
  }

  generatedTokenText = generateUnifiedToken(phone, expiry);
  document.getElementById('tokenOutput').textContent = generatedTokenText;
  document.getElementById('resultBox').style.display = 'flex';

  // حفظ الشعار والبيانات مرتبطة بالتوكن بدقة في التخزين المشترك
  clientsData[generatedTokenText] = { 
    name, 
    phone, 
    expiry, 
    logoUrl: logoUrl || "https://i.ibb.co/RGVnJmKH/IMG-20261101-200058.webp", 
    createdAt: new Date().toLocaleDateString('ar-EG') 
  };
  
  localStorage.setItem("yt_valid_tokens", JSON.stringify(clientsData));
  renderClients();

  showToast("تم توليد الكود وحفظه مع الشعار بنجاح 🚀");
}

function renderClients() {
  const listEl = document.getElementById('clientList');
  const searchVal = document.getElementById('searchClient').value.toLowerCase().trim();
  const keys = Object.keys(clientsData);
  
  document.getElementById('clientsCount').textContent = keys.length;

  if (keys.length === 0) {
    listEl.innerHTML = '<div class="empty-state">لا يوجد عملاء مسجلون حتى الآن</div>';
    return;
  }

  let html = '';
  keys.reverse().forEach(token => {
    const item = clientsData[token];
    if (!item) return;

    const nameMatch = (item.name || '').toLowerCase().includes(searchVal);
    const phoneMatch = (item.phone || '').toLowerCase().includes(searchVal);
    const tokenMatch = token.toLowerCase().includes(searchVal);

    if (searchVal && !nameMatch && !phoneMatch && !tokenMatch) return;

    const expiryLabel = item.expiry === '2099-12-31' ? 'Lifetime (دائم)' : item.expiry;

    html += `
      <div class="client-card">
        <div class="client-top">
          <div>
            <div class="client-name">${item.name}</div>
            <div class="client-phone"><i class="fa-solid fa-phone" style="font-size:9px;"></i> ${item.phone}</div>
          </div>
          <div class="card-actions">
            <button class="btn-icon" onclick="sendWhatsAppDirect('${item.phone}', '${item.name}', '${token}', '${item.expiry}')" title="واتساب">
              <i class="fa-brands fa-whatsapp" style="color:var(--green)"></i>
            </button>
            <button class="btn-icon delete" onclick="deleteClient('${token}')" title="حذف العميل يدوياً">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
        <div class="client-token-row">
          <span class="client-token">${token}</span>
          <button class="btn-icon" onclick="copyText('${token}')" title="نسخ التوكن">
            <i class="fa-solid fa-copy"></i>
          </button>
        </div>
        <div class="client-footer">
          <span>📅 انتهاء الصلاحية: <strong class="badge-expiry">${expiryLabel}</strong></span>
          ${item.logoUrl ? '<span title="يحتوي على شعار"><i class="fa-solid fa-image" style="color:var(--lime)"></i> شعار مضاف</span>' : ''}
        </div>
      </div>
    `;
  });

  listEl.innerHTML = html || '<div class="empty-state">لا توجد نتائج مطابقة للبحث</div>';
}

function deleteClient(token) {
  if (confirm(`هل أنت متأكد من رغبتك في حذف العميل وكود التوكن (${token}) نهائياً من اللوحة؟`)) {
    delete clientsData[token];
    localStorage.setItem("yt_valid_tokens", JSON.stringify(clientsData));
    renderClients();
    showToast("✓ تم الحذف يدوياً بنجاح");
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  showToast("✓ تم النسخ بنجاح");
}

function copyToken() {
  copyText(generatedTokenText);
}

function sendViaWhatsApp() {
  const phone = document.getElementById('genPhone').value.trim().replace(/\D/g, '');
  const name = document.getElementById('genName').value.trim();
  const expiry = document.getElementById('genExpiry').value;
  sendWhatsAppDirect(phone, name, generatedTokenText, expiry);
}

function sendWhatsAppDirect(phone, name, token, expiry) {
  const cleanPhone = phone.replace(/\D/g, '');
  const expiryText = expiry === '2099-12-31' ? 'Lifetime (دائم)' : expiry;
  const msg = `مرحباً بك يا ${name} 👋\nإليك كود التفعيل (Token) الخاص بك:\n\n🔑 Token: *${token}*\n📅 الصلاحية: ${expiryText}\n\nاستمتع بالمشاهدة! 📺🚀`;
  window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
