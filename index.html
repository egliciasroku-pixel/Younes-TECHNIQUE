<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUXURY IPTV - Royal Auto-Update</title>
    <!-- خطوط جوجل الفاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #080808;
            --bg-card: rgba(18, 18, 18, 0.75);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --accent-glow: rgba(212, 175, 55, 0.35);
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border-glass: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(170, 130, 10, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* شاشة الإعدادات وربوت التخزين المحلي */
        #setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .setup-card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(10, 10, 10, 0.95));
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 40px var(--accent-glow);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }

        .setup-card h2 {
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 900;
        }

        .setup-card p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: var(--gold-light);
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .royal-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
        }

        /* التصميم الرئيسي للتطبيق */
        #app-container {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            color: var(--gold-primary);
            font-size: 22px;
            filter: drop-shadow(0 0 8px var(--gold-primary));
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(to right, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--gold-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--gold-primary);
            color: #000;
        }

        /* الأقسام الثلاثة الملكي */
        .main-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px 20px;
            background: rgba(15, 15, 15, 0.6);
        }

        .tab-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid var(--border-glass);
            padding: 10px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(170, 130, 10, 0.1));
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .content-area {
            padding: 0 20px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
        }

        .section-title {
            font-size: 14px;
            color: var(--gold-light);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* التصنيفات */
        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: rgba(25, 25, 25, 0.7);
            border: 1px solid var(--border-glass);
            padding: 7px 14px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-chip.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 700;
            border-color: var(--gold-primary);
        }

        /* شبكة القنوات */
        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .channel-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-2px);
        }

        .channel-poster {
            width: 100%;
            height: 100px;
            background: #151515;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .channel-poster i {
            font-size: 26px;
            color: var(--gold-primary);
        }

        .channel-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .channel-info {
            padding: 8px;
            text-align: center;
        }

        .channel-info h4 {
            font-size: 12px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* مشغل الفيديو */
        #player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 10, 10, 0.9);
        }

        .player-header h3 {
            color: var(--gold-light);
            font-size: 15px;
        }

        .close-player {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            outline: none;
        }

        /* شاشة التحميل */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader p {
            color: var(--gold-light);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- نافذة الإعدادات وربوت التخزين المحلي -->
    <div id="setup-screen">
        <div class="setup-card">
            <h2>LUXURY IPTV</h2>
            <p>أدخل بيانات السيرفر أو رابط التحديث الخارجي من GitHub</p>
            
            <div class="input-group">
                <label>رابط التحديث من GitHub (اختياري / JSON أو API)</label>
                <input type="text" id="in-github-json" placeholder="https://raw.githubusercontent.com/.../config.json">
            </div>
            <div class="input-group">
                <label>عنوان السيرفر (Host URL)</label>
                <input type="text" id="in-host" placeholder="http://example.com:8080">
            </div>
            <div class="input-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="in-user" placeholder="Username">
            </div>
            <div class="input-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="in-pass" placeholder="Password">
            </div>

            <button class="royal-btn" onclick="saveAndConnect()">دخول ملكي مباشر</button>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <p>جاري مزامنة القنوات من التحديثات...</p>
    </div>

    <!-- واجهة التطبيق الرئيسية -->
    <div id="app-container">
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-crown"></i>
                <h1>ROYAL PLAYER</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="refreshData()" title="تحديث المحتوى"><i class="fa-solid fa-rotate"></i></button>
                <button class="icon-btn" onclick="resetSettings()" title="الإعدادات"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- الأقسام الثلاثة -->
        <div class="main-tabs">
            <button class="tab-btn active" onclick="switchTab('live')" id="tab-live">
                <i class="fa-solid fa-tv"></i> LIVE
            </button>
            <button class="tab-btn" onclick="switchTab('movie')" id="tab-movie">
                <i class="fa-solid fa-film"></i> FILMS
            </button>
            <button class="tab-btn" onclick="switchTab('series')" id="tab-series">
                <i class="fa-solid fa-video"></i> SERIES
            </button>
        </div>

        <div class="content-area">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="بحث سريع..." oninput="filterChannels()">
            </div>

            <div class="section-title"><i class="fa-solid fa-list"></i> التصنيفات</div>
            <div class="categories-container" id="categories-list"></div>

            <div class="section-title"><i class="fa-solid fa-play"></i> المحتوى المتاح</div>
            <div class="grid-channels" id="channels-grid"></div>
        </div>
    </div>

    <!-- مشغل الفيديو -->
    <div id="player-modal">
        <div class="player-header">
            <h3 id="player-title">تشغيل</h3>
            <button class="close-player" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="video-container">
            <video id="native-video" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        let serverData = { host: '', user: '', pass: '', githubJson: '' };
        let currentType = 'live'; 
        let categoriesData = [];
        let channelsData = [];
        let activeCategory = 'all';

        // روبوت التخزين المحلي التلقائي عند التشغيل
        window.addEventListener('DOMContentLoaded', () => {
            const savedHost = localStorage.getItem('lux_host');
            const savedUser = localStorage.getItem('lux_user');
            const savedPass = localStorage.getItem('lux_pass');
            const savedJson = localStorage.getItem('lux_github_json');

            if (savedHost && savedUser && savedPass) {
                serverData.host = savedHost.trim().replace(/\/$/, "");
                serverData.user = savedUser.trim();
                serverData.pass = savedPass.trim();
                serverData.githubJson = savedJson ? savedJson.trim() : '';

                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                
                loadPortalData();
            }
        });

        function saveAndConnect() {
            let host = document.getElementById('in-host').value.trim();
            let user = document.getElementById('in-user').value.trim();
            let pass = document.getElementById('in-pass').value.trim();
            let gJson = document.getElementById('in-github-json').value.trim();

            if (!host || !user || !pass) {
                alert('المرجو تعبئة بيانات السيرفر الأساسية.');
                return;
            }

            localStorage.setItem('lux_host', host);
            localStorage.setItem('lux_user', user);
            localStorage.setItem('lux_pass', pass);
            if (gJson) localStorage.setItem('lux_github_json', gJson);

            location.reload();
        }

        function resetSettings() {
            if(confirm('هل تريد إعادة تعيين الإعدادات؟')) {
                localStorage.clear();
                location.reload();
            }
        }

        function refreshData() {
            loadPortalData();
        }

        function switchTab(type) {
            currentType = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
            activeCategory = 'all';
            loadPortalData();
        }

        async function loadPortalData() {
            showLoader(true);
            try {
                // إذا وضع المستخدم رابط تحديث خارجي في GitHub، يمكنك جعله يقرأ ملفاً مخصصاً أو الاعتماد على الـ Xtream المعتاد
                let catAction = currentType === 'live' ? 'get_live_categories' : (currentType === 'movie' ? 'get_vod_categories' : 'get_series_categories');
                let listAction = currentType === 'live' ? 'get_live_streams' : (currentType === 'movie' ? 'get_vod_streams' : 'get_series');

                let catUrl = `${serverData.host}/player_api.php?username=${serverData.user}&password=${serverData.pass}&action=${catAction}`;
                let listUrl = `${serverData.host}/player_api.php?username=${serverData.user}&password=${serverData.pass}&action=${listAction}`;

                let catRes = await fetch(catUrl);
                categoriesData = await catRes.json();

                let listRes = await fetch(listUrl);
                channelsData = await listRes.json();

                renderCategories();
                renderChannels();
            } catch (error) {
                console.error(error);
                alert('خطأ في الاتصال بالسيرفر أو جلب التحديثات. تأكد من صحة روابط الـ HTTP.');
            } finally {
                showLoader(false);
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-list');
            let html = `<div class="cat-chip active" onclick="filterByCategory('all', this)">الكل</div>`;

            if (Array.isArray(categoriesData)) {
                categoriesData.forEach(cat => {
                    html += `<div class="cat-chip" onclick="filterByCategory('${cat.category_id}', this)">${cat.category_name}</div>`;
                });
            }
            container.innerHTML = html;
        }

        function filterByCategory(catId, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            activeCategory = catId;
            renderChannels();
        }

        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            let filtered = channelsData;

            if (activeCategory !== 'all') {
                filtered = channelsData.filter(item => item.category_id == activeCategory);
            }

            let html = '';
            if (!Array.isArray(filtered) || filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:20px;">لا توجد محتويات</p>';
                return;
            }

            filtered.slice(0, 100).forEach(item => {
                let name = item.name || item.title || 'قناة';
                let img = item.stream_icon || item.cover || '';
                let id = item.stream_id || item.series_id;
                let posterHtml = img ? `<img src="${img}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\'fa-solid fa-tv\'></i>';">` : `<i class="fa-solid fa-tv"></i>`;

                html += `
                    <div class="channel-card" onclick="playChannel('${id}', '${name.replace(/'/g, "")}')">
                        <div class="channel-poster">${posterHtml}</div>
                        <div class="channel-info">
                            <h4>${name}</h4>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterChannels() {
            let query = document.getElementById('search-input').value.toLowerCase();
            let filtered = channelsData.filter(item => {
                let name = (item.name || item.title || '').toLowerCase();
                return name.includes(query);
            });

            const grid = document.getElementById('channels-grid');
            let html = '';
            filtered.slice(0, 100).forEach(item => {
                let name = item.name || item.title || '';
                let img = item.stream_icon || item.cover || '';
                let id = item.stream_id || item.series_id;
                let posterHtml = img ? `<img src="${img}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\'fa-solid fa-tv\'></i>';">` : `<i class="fa-solid fa-tv"></i>`;

                html += `
                    <div class="channel-card" onclick="playChannel('${id}', '${name.replace(/'/g, "")}')">
                        <div class="channel-poster">${posterHtml}</div>
                        <div class="channel-info">
                            <h4>${name}</h4>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function playChannel(id, name) {
            let streamUrl = '';
            if (currentType === 'live') {
                streamUrl = `${serverData.host}/live/${serverData.user}/${serverData.pass}/${id}.m3u8`;
            } else if (currentType === 'movie') {
                let ext = 'mp4';
                let matched = channelsData.find(m => m.stream_id == id);
                if (matched && matched.container_extension) ext = matched.container_extension;
                streamUrl = `${serverData.host}/movie/${serverData.user}/${serverData.pass}/${id}.${ext}`;
            } else {
                alert('قسم المسلسلات يتطلب اختيار الحلقة.');
                return;
            }

            document.getElementById('player-title').innerText = name;
            let videoElem = document.getElementById('native-video');
            videoElem.src = streamUrl;
            document.getElementById('player-modal').style.display = 'flex';
            videoElem.play().catch(e => console.log(e));
        }

        function closePlayer() {
            let videoElem = document.getElementById('native-video');
            videoElem.pause();
            videoElem.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
