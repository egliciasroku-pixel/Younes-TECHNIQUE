<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAROUKII LUXURY - Media Player Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-base: #0d0608;
            --card-luxury: linear-gradient(145deg, #180b10, #0a0407);
            --accent-gold: #f59e0b;
            --accent-gold-light: #fcd34d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            border: none;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-brand-card, .clock-card, .control-panel, .menu-card, .sidebar-channels, .player-box, .footer-card {
            background: var(--card-luxury);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
        }

        .top-brand-card {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title h2 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
        }

        .brand-title span {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        .device-status {
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--accent-gold);
            font-weight: 700;
            text-align: center;
        }

        .clock-card {
            padding: 20px;
            text-align: center;
        }

        .clock-card .crown {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .clock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .control-panel {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-panel input {
            width: 100%;
            padding: 12px 14px;
            background: #050203;
            border-radius: 12px;
            color: #fff;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .control-panel input:focus {
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            color: #000;
            font-weight: 900;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
            transition: 0.2s;
        }

        .btn-gold:hover { opacity: 0.9; transform: translateY(-1px); }

        .console-log {
            background: #020102;
            border-radius: 10px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 0.72rem;
            color: #34d399;
            max-height: 65px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-card {
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .menu-card:hover, .menu-card.active {
            background: linear-gradient(145deg, #241018, #120509);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.25);
        }

        .menu-card svg {
            width: 38px;
            height: 38px;
            fill: var(--accent-gold);
        }

        .menu-card span {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .sidebar-channels {
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
        }

        .sidebar-channels.open {
            display: flex;
        }

        .channel-row {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #fff;
            transition: 0.2s;
        }

        .channel-row:hover {
            background: rgba(245, 158, 11, 0.2);
            padding-right: 18px;
        }

        .player-box {
            background: #000;
            overflow: hidden;
            display: none;
            aspect-ratio: 16 / 9;
        }

        .player-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .footer-card {
            padding: 15px;
            text-align: center;
        }

        .footer-card .crown-icon {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .footer-card h3 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .footer-card p {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- 1. بطاقة الهوية العلوية -->
    <div class="top-brand-card">
        <div class="brand-title">
            <h2>FAROUKII</h2>
            <span>LUXURY</span>
        </div>
        <div class="device-status">
            🛡️ Active & Locked<br>🔒 Device
        </div>
    </div>

    <!-- 2. بطاقة الساعة والتاج -->
    <div class="clock-card">
        <div class="crown">👑</div>
        <div class="clock-header">
            <span>FAROUKII</span>
            <span id="liveClock">00:00:00</span>
            <span>LUXURY</span>
        </div>
    </div>

    <!-- 3. لوحة التحكم والاتصال -->
    <div class="control-panel">
        <input type="text" id="apiInput" placeholder="أدخل رابط Xtream Codes الكامل هنا...">
        <button class="btn-gold" onclick="saveAndConnect()">حفظ والاتصال بالسيرفر ⚡</button>
        <div class="console-log" id="consoleLog">
            [FAROUKII] أدخل الرابط واضغط اتصال...
        </div>
    </div>

    <!-- 4. الأقسام الأربعة الرئيسية -->
    <div class="grid-menu">
        <div class="menu-card" onclick="switchCategory('live', this)">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            <span>Live TV</span>
        </div>
        <div class="menu-card" onclick="switchCategory('films', this)">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            <span>Movies</span>
        </div>
        <div class="menu-card" onclick="switchCategory('series', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6.47L5.76 4H20v15H4V6.47M22 2H2v20h20V2z"/></svg>
            <span>Series</span>
        </div>
        <div class="menu-card" onclick="alert('قسم المفضلة قيد التفعيل')">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            <span>Favorites</span>
        </div>
    </div>

    <!-- 5. نافذة القنوات المخفية -->
    <div class="sidebar-channels" id="sidebarChannels">
        <input type="text" id="searchBox" placeholder="بحث سريع..." oninput="filterItems()" style="width:100%; padding:10px; background:#050203; border-radius:10px; color:#fff; font-size:0.85rem;">
        <div id="itemsContainer" style="display:flex; flex-direction:column; gap:6px;">
            <div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:15px;">اختر قسماً لعرض المحتوى...</div>
        </div>
    </div>

    <!-- 6. مشغل الفيديو -->
    <div class="player-box" id="playerBox">
        <video id="mainVideo" controls></video>
    </div>

    <!-- 7. شريط الحقوق في الأسفل -->
    <div class="footer-card">
        <span class="crown-icon">👑</span>
        <h3>FAROUKII LUXURY MEDIA PLAYER</h3>
        <p>All Rights Reserved &copy; 2026</p>
    </div>

</div>

<script>
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').textContent = now.toLocaleTimeString();
    }, 1000);

    let host = "", username = "", password = "";
    let currentCategory = "live";
    let cachedData = { live: [], films: [], series: [] };

    function log(msg) {
        const box = document.getElementById('consoleLog');
        box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        box.scrollTop = box.scrollHeight;
    }

    function saveAndConnect() {
        const rawUrl = document.getElementById('apiInput').value.trim();
        if (!rawUrl) {
            alert('يرجى إدخال رابط Xtream Codes أولاً.');
            return;
        }

        try {
            const urlObj = new URL(rawUrl);
            host = `${urlObj.protocol}//${urlObj.host}`;
            const params = new URLSearchParams(urlObj.search);
            username = params.get('username') || params.get('user') || '';
            password = params.get('password') || params.get('pass') || '';
        } catch(e) {
            alert('رابط غير صالح.');
            return;
        }

        if (!username || !password) {
            alert('تعذر استخراج بيانات الدخول من الرابط.');
            return;
        }

        log("✅ تم حفظ البيانات بنجاح! اختر أي قسم (Live TV أو Movies أو Series) لجلب محتواه فوراً.");
        alert("تم الحفظ بنجاح! يمكنك الآن الضغط على أي قسم لعرض القنوات.");
    }

    async function switchCategory(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.menu-card').forEach(c => c.classList.remove('active'));
        if(element) element.classList.add('active');

        if (!host || !username || !password) {
            alert("يرجى إدخال الرابط والضغط على (حفظ والاتصال بالسيرفر) في الأعلى أولاً.");
            return;
        }

        const sidebar = document.getElementById('sidebarChannels');
        sidebar.classList.add('open');

        // إذا كانت البيانات مخزنة مسبقاً، اعرضها فوراً بدون طلب جديد لسرعة فائقة
        if (cachedData[cat].length > 0) {
            renderList();
            return;
        }

        // جلب البيانات للقسم المحدد فقط منعاً للضغط على السيرفر
        let action = "";
        if (cat === 'live') action = "get_live_streams";
        else if (cat === 'films') action = "get_vod_streams";
        else if (cat === 'series') action = "get_series";

        const targetUrl = `${host}/player_api.php?username=${username}&password=${password}&action=${action}`;
        
        const container = document.getElementById('itemsContainer');
        container.innerHTML = '<div style="text-align:center; color:var(--accent-gold); font-size:0.8rem; padding:15px;">⏳ جاري جلب محتوى القسم...</div>';
        log(`جاري جلب بيانات ${cat.toUpperCase()}...`);

        const attempts = [
            targetUrl,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];

        let success = false;
        for (let url of attempts) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const json = await res.json();
                    if (Array.isArray(json)) {
                        cachedData[cat] = json;
                        success = true;
                        log(`✨ تم جلب ${json.length} عنصر بنجاح.`);
                        break;
                    }
                }
            } catch(e) {}
        }

        if (success) {
            renderList();
        } else {
            container.innerHTML = '<div style="text-align:center; color:#f87171; font-size:0.8rem; padding:15px;">⚠️ فشل جلب البيانات، تأكد من صحة الرابط أو حالة السيرفر.</div>';
            log(`❌ فشل جلب بيانات ${cat.toUpperCase()}.`);
        }
    }

    function renderList() {
        const container = document.getElementById('itemsContainer');
        container.innerHTML = '';
        const items = cachedData[currentCategory] || [];

        if (items.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:15px;">لا توجد عناصر.</div>';
            return;
        }

        const fragment = document.createDocumentFragment();
        items.forEach(item => {
            const name = item.name || item.title || "عنصر بدون اسم";
            const id = item.stream_id || item.series_id;
            const div = document.createElement('div');
            div.className = 'channel-row';
            div.textContent = `▶ ${name}`;
            div.onclick = () => playItem(id, name);
            fragment.appendChild(div);
        });
        container.appendChild(fragment);
    }

    function filterItems() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const items = cachedData[currentCategory] || [];
        const filtered = items.filter(i => (i.name || i.title || "").toLowerCase().includes(query));
        
        const container = document.getElementById('itemsContainer');
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();
        filtered.forEach(item => {
            const name = item.name || item.title || "";
            const id = item.stream_id || item.series_id;
            const div = document.createElement('div');
            div.className = 'channel-row';
            div.textContent = `▶ ${name}`;
            div.onclick = () => playItem(id, name);
            fragment.appendChild(div);
        });
        container.appendChild(fragment);
    }

    function playItem(id, name) {
        const playerBox = document.getElementById('playerBox');
        playerBox.style.display = 'block';
        const video = document.getElementById('mainVideo');

        let streamUrl = "";
        if (currentCategory === 'live') {
            streamUrl = `${host}/live/${username}/${password}/${id}.m3u8`;
        } else if (currentCategory === 'films') {
            streamUrl = `${host}/movie/${username}/${password}/${id}.mp4`;
        } else if (currentCategory === 'series') {
            streamUrl = `${host}/series/${username}/${password}/${id}.mp4`;
        }

        log(`تشغيل: ${name}`);

        if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
            if (window.hls) window.hls.destroy();
            window.hls = new Hls();
            window.hls.loadSource(streamUrl);
            window.hls.attachMedia(video);
            window.hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = streamUrl;
            video.play().catch(e => log("تنبيه المشغل: يتطلب تفاعل المتصفح لتشغيل الفيديو."));
        }
    }
</script>

</body>
</html>
